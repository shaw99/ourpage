<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的时间记录</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="header">
        <h1>我们的时间记录</h1>
        <div class="avatars">
            <div class="avatar">
                <img src="./image/boy.jpg" alt="男孩头像" id="boyAvatar">
            </div>
            <div class="avatar">
                <img src="./image/girl.jpg" alt="女孩头像" id="girlAvatar">
            </div>
        </div>
        <p id="timeElapsed" class="countdown"></p>
    </div>

    <div id="bubble" class="bubble"></div>

    <!-- 使用CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
